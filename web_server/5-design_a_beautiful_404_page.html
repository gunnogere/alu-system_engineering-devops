<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>404</title>
<style>
body{
    margin:0;
    height:100vh;
    display:grid;
    place-items:center;
    background:linear-gradient(#0f172a,#1e3a8a);
    color:#fff;
    font:20px Arial,sans-serif;
    text-align:center;
}
.box{padding:2rem}
h1{font-size:5rem;margin:0}
.pipe{font-size:4rem;animation:drip 1s infinite alternate}
small{
    display:inline-block;
    margin-top:1rem;
    padding:.5rem 1rem;
    background:#0ea5e9;
    border-radius:20px;
}
@keyframes drip{
    from{transform:translateY(0)}
    to{transform:translateY(10px)}
}
</style>
</head>
<body>
<div class="box">
    <div class="pipe">🔧🚰💧</div>
    <h1>404</h1>
    <p>The pipe burst... this page leaked away.</p>
    <small>Ceci n'est pas une page</small>
</div>
</body>
</html>
